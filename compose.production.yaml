services:
  control:
    image: ${PROXY_TESTER_CONTROL_IMAGE:-proxy-tester-control:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///data/proxy-tester.db?mode=rwc
      PROXY_TESTER_STATIC_DIR: /frontend/dist
      PROXY_TESTER_ARTIFACT_DIR: /data/artifacts
      PROXY_TESTER_RETENTION_DAYS: ${PROXY_TESTER_RETENTION_DAYS:-90}
      PROXY_TESTER_AGENT_GRACE_SECS: ${PROXY_TESTER_AGENT_GRACE_SECS:-10}
      PROXY_TESTER_COMMAND_TIMEOUT_SECS: ${PROXY_TESTER_COMMAND_TIMEOUT_SECS:-10}
      RUST_LOG: proxy_control=info
    ports:
      - "${PROXY_TESTER_PORT:-18080}:8080"
      - "${PROXY_TESTER_GRPC_PORT:-50051}:50051"
    volumes:
      - proxy-data:/data

  client:
    image: ${PROXY_TESTER_AGENT_IMAGE:-proxy-tester-agent:local}
    restart: unless-stopped
    environment:
      PROXY_TESTER_CONTROL: http://control:50051
      PROXY_TESTER_NODE_ID: client-1
      PROXY_TESTER_ROLE: client
      RUST_LOG: proxy_agent=info
    depends_on: [control]
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: [client-network-state:/var/lib/proxy-tester]

  server:
    image: ${PROXY_TESTER_AGENT_IMAGE:-proxy-tester-agent:local}
    restart: unless-stopped
    environment:
      PROXY_TESTER_CONTROL: http://control:50051
      PROXY_TESTER_NODE_ID: server-1
      PROXY_TESTER_ROLE: server
      RUST_LOG: proxy_agent=info
    depends_on: [control]
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: [server-network-state:/var/lib/proxy-tester]

volumes:
  proxy-data: {}
  client-network-state: {}
  server-network-state: {}
