syntax = "proto3";
package proxy_tester.v1;

service AgentControl { rpc AgentStream(stream AgentMessage) returns (stream ControlMessage); }

enum AgentRole { AGENT_ROLE_UNSPECIFIED = 0; AGENT_ROLE_CLIENT = 1; AGENT_ROLE_SERVER = 2; }

message AgentHello { string agent_id = 1; AgentRole role = 2; string hostname = 3; string version = 4; repeated string interfaces = 5; }
message Heartbeat { int64 unix_ms = 1; }
message Telemetry { string run_id = 1; string metrics_json = 2; }
message AgentEvent { string run_id = 1; string level = 2; string message = 3; }
message AgentMessage { oneof body { AgentHello hello = 1; Heartbeat heartbeat = 2; Telemetry telemetry = 3; AgentEvent event = 4; } }

message PrepareRun { string run_id = 1; string scenario_json = 2; }
message StartRun { string run_id = 1; int64 start_unix_ms = 2; }
message StopRun { string run_id = 1; }
message SetPaused { string run_id = 1; bool paused = 2; }
message ArtifactChunk {
  string artifact_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  uint64 total_size = 4;
  string sha256 = 5;
  bool eof = 6;
  string artifact_kind = 7;
}
message ControlMessage { oneof body { PrepareRun prepare = 1; StartRun start = 2; StopRun stop = 3; SetPaused set_paused = 4; ArtifactChunk artifact_chunk = 5; } }
