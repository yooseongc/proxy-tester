[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/proto",
  "crates/control",
  "crates/agent",
  "crates/capture",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws", "multipart"] }
bytes = "1.10"
h2 = "0.4"
http = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
http-body-util = "0.1"
prost = "0.13"
rcgen = "0.13"
time = "0.3"
rustls = "0.23"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tokio-rustls = "0.26"
tonic = "0.12"
tonic-build = "0.12"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
